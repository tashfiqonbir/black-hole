<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4K Interstellar Black Hole - by Onbir</title>
<style>
    * { margin: 0; padding: 0; overflow: hidden; }
  body {
    background: #000;
    font-family: 'Segoe UI', sans-serif;
  }
  canvas { display: block; }
  
  .title {
    position: absolute;
    top: 25px;
    width: 100%;
    text-align: center;
    color: #fff;
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 3px;
    text-shadow: 0 0 20px #00aaff;
    opacity: 0.8;
  }
  .social {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: #888;
    font-size: 13px;
  }
  .social a {
    color: #00aaff;
    text-decoration: none;
    margin: 0 12px;
    transition: 0.3s;
  }
  .social a:hover { color: #fff; text-shadow: 0 0 15px #00aaff; }
</style>
</head>
<body>
<div class="title">INTERSTELLAR BLACK HOLE</div>
<canvas id="canvas"></canvas>

<div class="social">
  Made by Onbir | 
  <a href="https://facebook.com/onbir.official" target="_blank">Facebook</a>
  <a href="https://instagram.com/tashfiqonbir" target="_blank">Instagram</a>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth * window.devicePixelRatio; // 4K support
let h = canvas.height = window.innerHeight * window.devicePixelRatio;
canvas.style.width = window.innerWidth + 'px';
canvas.style.height = window.innerHeight + 'px';
ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

const centerX = window.innerWidth / 2;
const centerY = window.innerHeight / 2;

// 800+ Stars for 4K
const stars = [];
for(let i=0; i<800; i++){
  stars.push({
    x: Math.random()*window.innerWidth,
    y: Math.random()*window.innerHeight,
    r: Math.random()*1.8,
    alpha: Math.random(),
    twinkle: Math.random()*0.05
  });
}

// Planets - Closer orbit
const planets = [
  {r: 160, angle: 0, speed: 0.003, size: 10, color: '#ffdd44'},
  {r: 220, angle: 3, speed: 0.0018, size: 14, color: '#44aaff'}
];

let time = 0;

function drawGravitationalLensing(){
  // This creates the "bent light" effect like Interstellar
  ctx.save();
  ctx.translate(centerX, centerY);
  for(let i=0; i<12; i++){
    let radius = 90 + i*18;
    let alpha = 0.8 - i*0.06;
    ctx.strokeStyle = `rgba(255, 180, 80, ${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, radius, radius*0.25, 0, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawAccretionDisk(){
  ctx.save();
  ctx.translate(centerX, centerY);
  ctx.rotate(time * 0.0008); // Slow rotation
  
  // Thick disk with doppler shift effect
  for(let i=0; i<5; i++){
    let diskGrad = ctx.createRadialGradient(0,0,80+i*10, 0,0, 320+i*20);
    diskGrad.addColorStop(0, 'rgba(255,200,50,0)');
    diskGrad.addColorStop(0.3, `rgba(255,${150-i*20},0,0.5)`);
    diskGrad.addColorStop(0.6, `rgba(255,${80-i*10},0,0.4)`);
    diskGrad.addColorStop(1, 'rgba(0,0,0,0)');
    
    ctx.fillStyle = diskGrad;
    ctx.beginPath();
    ctx.ellipse(0,0, 340+i*20, 100+i*15, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawBlackHole(){
  // Photon ring - bright ring around BH
  let photonRing = ctx.createRadialGradient(centerX, centerY, 78, centerX, centerY, 92);
  photonRing.addColorStop(0, 'rgba(255,255,255,0)');
  photonRing.addColorStop(0.5, 'rgba(255,220,150,0.9)');
  photonRing.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = photonRing;
  ctx.beginPath();
  ctx.arc(centerX, centerY, 85, 0, Math.PI*2);
  ctx.fill();

  // Event Horizon - Bigger and closer
  let coreGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 80);
  coreGrad.addColorStop(0, '#000');
  coreGrad.addColorStop(0.9, '#000');
  coreGrad.addColorStop(1, 'rgba(255,120,0,0.6)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(centerX, centerY, 80, 0, Math.PI*2);
  ctx.fill();
}

function drawPlanets(){
  planets.forEach(p => {
    p.angle += p.speed;
    let x = centerX + Math.cos(p.angle) * p.r;
    let y = centerY + Math.sin(p.angle) * p.r * 0.25;
    
    // Planet glow
    let glow = ctx.createRadialGradient(x, y, 0, x, y, p.size*4);
    glow.addColorStop(0, p.color);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, p.size*4, 0, Math.PI*2);
    ctx.fill();
    
    // Planet
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI*2);
    ctx.fill();
  });
}

function drawStars(){
  stars.forEach(s => {
    s.alpha += s.twinkle * (Math.random() > 0.5 ? 1 : -1);
    s.alpha = Math.max(0.1, Math.min(1, s.alpha));
    ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
}

function animate(){
  ctx.fillStyle = 'rgba(0,0,0,0.1)'; // Motion blur effect
  ctx.fillRect(0,0,window.innerWidth,window.innerHeight);
  
  drawStars();
  drawGravitationalLensing();
  drawAccretionDisk();
  drawBlackHole();
  drawPlanets();
  
  time++;
  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', ()=>{
  w = canvas.width = window.innerWidth * window.devicePixelRatio;
  h = canvas.height = window.innerHeight * window.devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
});
</script>
</body>
</html>
