<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gargantua V4 - by Onbir</title>
<style>
    * { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
  .title { position: absolute; top: 20px; width: 100%; text-align: center; color: #ddd; font-size: 18px; letter-spacing: 3px; opacity: 0.7; }
  .social { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #666; font-size: 13px; }
  .social a { color: #00aaff; text-decoration: none; margin: 0 15px; }
</style>
</head>
<body>
<div class="title">GARGANTUA V4</div>
<canvas id="c"></canvas>
<div class="social">
  Made by Onbir | 
  <a href="https://facebook.com/onbir.official" target="_blank">Facebook</a>
  <a href="https://instagram.com/tashfiqonbir" target="_blank">Instagram</a>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
c.width = innerWidth; c.height = innerHeight;
const cx = innerWidth/2, cy = innerHeight/2;
let t=0;

// 1200 Stars Background
const stars = Array.from({length:1200}, () => ({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*1.5, a:Math.random()}));

// 3 Planets - Different orbits
const planets = [
  {r:180, a:0, s:0.003, sz:8, col:'#ffdd44'},  // Close
  {r:250, a:2, s:0.0018, sz:12, col:'#44aaff'}, // Mid
  {r:320, a:4, s:0.001, sz:10, col:'#ff8844'}   // Far
];

function drawLensedStars(){
  stars.forEach(s=>{
    s.a += (Math.random()-0.5)*0.02;
    let dx = s.x - cx, dy = s.y - cy;
    let dist = Math.sqrt(dx*dx + dy*dy);
    if(dist > 160 && dist < 500){
      let angle = Math.atan2(dy,dx);
      let bend = 4000 / dist;
      let newAngle = angle + bend;
      let x = cx + Math.cos(newAngle) * dist;
      let y = cy + Math.sin(newAngle) * dist;
      ctx.fillStyle=`rgba(255,255,255,${s.a})`;
      ctx.beginPath(); ctx.arc(x,y,s.r,0,7); ctx.fill();
    } else if(dist >= 500){
      ctx.fillStyle=`rgba(255,255,255,${s.a})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
    }
  });
}

function drawAccretionDisk(){
  ctx.save(); 
  ctx.translate(cx,cy); 
  ctx.rotate(t*0.0005);
  
  for(let i=0; i<360; i+=2){
    let angle = i * Math.PI/180;
    let brightness = 0.3 + 0.7 * Math.sin(angle + t*0.001);
    let r = 160 + Math.sin(angle*3)*10;
    
    let g = ctx.createRadialGradient(0,0,r, 0,0, r+140);
    g.addColorStop(0, `rgba(255,${200+brightness*55},100,${brightness})`);
    g.addColorStop(0.5, `rgba(255,${120+brightness*50},0,${brightness*0.7})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    
    ctx.strokeStyle = g;
    ctx.lineWidth = 70;
    ctx.beginPath();
    ctx.arc(0,0,r, angle, angle+0.08);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPlanets(){
  planets.forEach(p=>{
    p.a += p.s;
    let x = cx + Math.cos(p.a)*p.r;
    let y = cy + Math.sin(p.a)*p.r*0.25;
    
    // Check if planet is behind BH
    let behind = Math.sin(p.a) > 0;
    
    if(behind){
      // Draw behind disk
      ctx.fillStyle = p.col+'44'; // faded
      ctx.beginPath(); ctx.arc(x,y,p.sz,0,7); ctx.fill();
    }
  });
}

function drawBlackHole(){
  // Photon ring
  let ring = ctx.createRadialGradient(cx,cy,155, cx,cy,165);
  ring.addColorStop(0,'rgba(255,255,255,0)'); 
  ring.addColorStop(0.5,'rgba(255,240,200,0.9)'); 
  ring.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=ring; 
  ctx.beginPath(); 
  ctx.arc(cx,cy,160,0,7); 
  ctx.fill();
  
  // Shadow
  ctx.fillStyle='#000'; 
  ctx.beginPath(); 
  ctx.arc(cx,cy,150,0,7); 
  ctx.fill();
  
  // Planets in front
  planets.forEach(p=>{
    let x = cx + Math.cos(p.a)*p.r;
    let y = cy + Math.sin(p.a)*p.r*0.25;
    let behind = Math.sin(p.a) > 0;
    
    if(!behind){
      // Glow
      let glow = ctx.createRadialGradient(x,y,0, x,y,p.sz*3);
      glow.addColorStop(0,p.col); glow.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=glow;
      ctx.beginPath(); ctx.arc(x,y,p.sz*3,0,7); ctx.fill();
      
      // Planet
      ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(x,y,p.sz,0,7); ctx.fill();
    }
  });
}

function animate(){
  ctx.fillStyle = 'rgba(0,0,0,0.1)'; 
  ctx.fillRect(0,0,innerWidth,innerHeight);
  
  drawLensedStars();
  drawPlanets(); // Behind first
  drawAccretionDisk();
  drawBlackHole(); // Front planets last
  
  t++; 
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
