<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARGANTUA GOAT - by Onbir</title>
<style>
    * { margin: 0; padding: 0; overflow: hidden; background: radial-gradient(ellipse at center, #050510 0%, #000 100%); }
  canvas { display: block; filter: blur(0.3px); }
  .title { position: absolute; top: 3vh; width: 100%; text-align: center; color: #ffddaa; font-size: 20px; letter-spacing: 5px; text-shadow: 0 0 20px #ffaa00; font-family: Arial; }
  .social { position: absolute; bottom: 3vh; width: 100%; text-align: center; color: #555; font-size: 14px; font-family: Arial; }
  .social a { color: #00aaff; text-decoration: none; margin: 0 20px; transition: 0.3s; }
  .social a:hover { color: #fff; text-shadow: 0 0 10px #00aaff; }
</style>
</head>
<body>
<div class="title">GARGANTUA</div>
<canvas id="c"></canvas>
<div class="social">
  Made by Onbir | 
  <a href="https://facebook.com/onbir.official" target="_blank">Facebook</a>
  <a href="https://instagram.com/tashfiqonbir" target="_blank">Instagram</a>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let W = innerWidth, H = innerHeight;
c.width = W; c.height = H;
const cx = W/2, cy = H/2;
let t = 0;

// 1500 stars with depth
const stars = Array.from({length:1500}, () => ({
  x: Math.random()*W, y: Math.random()*H, 
  r: Math.random()*1.8, depth: Math.random()
}));

// 3 planets
const planets = [
  {r:170, a:0, s:0.004, sz:9, col:'#ffdd55'},
  {r:240, a:2.5, s:0.002, sz:13, col:'#55aaff'},
  {r:310, a:5, s:0.001, sz:11, col:'#ff8855'}
];

function draw(){
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0,0,W,H);

  // Stars with gravitational lensing
  stars.forEach(s=>{
    let dx = s.x - cx, dy = s.y - cy;
    let dist = Math.hypot(dx,dy);
    let alpha = 0.3 + s.depth*0.7;
    
    if(dist > 155 && dist < 450){
      let angle = Math.atan2(dy,dx);
      let bend = 5000/dist * (1-s.depth);
      angle += bend;
      let x = cx + Math.cos(angle)*dist;
      let y = cy + Math.sin(angle)*dist;
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath(); ctx.arc(x,y,s.r,0,Math.PI*2); ctx.fill();
    } else if(dist >= 450){
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
  });

  // Accretion Disk - 3D effect
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(t*0.0008);
  
  for(let i=0; i<180; i++){
    let ang = i*Math.PI/180;
    let bright = 0.4 + 0.6*Math.sin(ang*2 + t*0.002);
    let radius = 158 + Math.sin(ang*4)*8;
    
    let gradient = ctx.createRadialGradient(0,0,radius, 0,0,radius+130);
    gradient.addColorStop(0, `rgba(255,${220+bright*35},120,${bright})`);
    gradient.addColorStop(0.6, `rgba(255,${100+bright*80},0,${bright*0.8})`);
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    
    ctx.strokeStyle = gradient;
    ctx.lineWidth = 80;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0,0,radius, ang, ang+0.12);
    ctx.stroke();
  }
  ctx.restore();

  // Planets behind
  planets.forEach(p=>{
    p.a += p.s;
    let x = cx + Math.cos(p.a)*p.r;
    let y = cy + Math.sin(p.a)*p.r*0.22;
    if(Math.sin(p.a) > 0){ // behind
      ctx.fillStyle = p.col+'33';
      ctx.beginPath(); ctx.arc(x,y,p.sz,0,Math.PI*2); ctx.fill();
    }
  });

  // Photon Ring - GOAT
  for(let i=0; i<3; i++){
    let ringGrad = ctx.createRadialGradient(cx,cy,155-i, cx,cy,165+i);
    ringGrad.addColorStop(0,'rgba(255,255,255,0)');
    ringGrad.addColorStop(0.5,`rgba(255,240,180,${0.9-i*0.2})`);
    ringGrad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = ringGrad;
    ctx.beginPath(); ctx.arc(cx,cy,160,0,Math.PI*2); ctx.fill();
  }

  // Black Hole Core
  let shadowGrad = ctx.createRadialGradient(cx,cy,0, cx,cy,150);
  shadowGrad.addColorStop(0,'#000');
  shadowGrad.addColorStop(1,'rgba(0,0,0,0.8)');
  ctx.fillStyle = shadowGrad;
  ctx.beginPath(); ctx.arc(cx,cy,150,0,Math.PI*2); ctx.fill();

  // Planets front
  planets.forEach(p=>{
    let x = cx + Math.cos(p.a)*p.r;
    let y = cy + Math.sin(p.a)*p.r*0.22;
    if(Math.sin(p.a) <= 0){ // front
      let glow = ctx.createRadialGradient(x,y,0, x,y,p.sz*4);
      glow.addColorStop(0,p.col); glow.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(x,y,p.sz*4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(x,y,p.sz,0,Math.PI*2); ctx.fill();
    }
  });

  t++;
  requestAnimationFrame(draw);
}
draw();

window.addEventListener('resize', ()=>{
  W = innerWidth; H = innerHeight;
  c.width = W; c.height = H;
});
</script>
</body>
</html>
