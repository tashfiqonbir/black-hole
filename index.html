<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4K Black Hole V2 - Onbir</title>
<style>
    * { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
  .title { position: absolute; top: 20px; width: 100%; text-align: center; color: #fff; font-size: 22px; letter-spacing: 4px; text-shadow: 0 0 30px #ffaa00; }
  .social { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #888; font-size: 14px; }
  .social a { color: #00aaff; text-decoration: none; margin: 0 15px; }
</style>
</head>
<body>
<div class="title">INTERSTELLAR BLACK HOLE V2</div>
<canvas id="c"></canvas>
<div class="social">
  Made by Onbir | 
  <a href="https://facebook.com/onbir.official" target="_blank">Facebook</a>
  <a href="https://instagram.com/tashfiqonbir" target="_blank">Instagram</a>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
c.width = innerWidth; c.height = innerHeight;
const cx = innerWidth/2, cy = innerHeight/2;
let t=0;

const stars = Array.from({length:1000}, () => ({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*2}));

const planets = [{r:140,a:0,s:0.004,sz:12,col:'#ffdd00'},{r:200,a:2,s:0.002,sz:16,col:'#00aaff'}];

function loop(){
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(0,0,innerWidth,innerHeight);
  
  // Stars
  stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${Math.random()})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();});
  
  // Massive Accretion Disk
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(t*0.001);
  for(let i=0;i<6;i++){
    let g = ctx.createRadialGradient(0,0,100, 0,0, 400);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(0.4,`rgba(255,${120-i*10},0,0.6)`); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0, 450, 120, 0, 0, 7); ctx.fill();
  }
  ctx.restore();
  
  // Photon Ring
  let ring = ctx.createRadialGradient(cx,cy,150, cx,cy,170);
  ring.addColorStop(0.5,'rgba(255,240,200,1)'); 
  ctx.fillStyle=ring; ctx.beginPath(); ctx.arc(cx,cy,160,0,7); ctx.fill();
  
  // BIG Black Hole Core
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(cx,cy,150,0,7); ctx.fill();
  
  // Planets
  planets.forEach(p=>{p.a+=p.s; let x=cx+Math.cos(p.a)*p.r; let y=cy+Math.sin(p.a)*p.r*0.2; ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(x,y,p.sz,0,7); ctx.fill();});
  
  t++; requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
